<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Achtergrond 6</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:#f2f2f2;font-family:'Work Sans',sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 28px;font:12px 'JetBrains Mono';color:#8e8e8e;z-index:3}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{font-weight:300;font-size:clamp(28px,5vw,56px);letter-spacing:-.02em;max-width:14em;line-height:1.08}
p.s{color:#8e8e8e;margin:14px 0 26px;max-width:30em;font-size:15px}
.k{width:min(460px,100%);background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);padding:16px;text-align:left}
textarea{width:100%;height:84px;background:transparent;border:0;color:#f2f2f2;font:14px 'JetBrains Mono';resize:none;outline:0}
.r{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:12px 'JetBrains Mono';color:#8e8e8e}
button{background:#f2f2f2;color:#000;border:0;padding:10px 18px;font:500 13px 'Work Sans';cursor:pointer}
.tag{position:fixed;bottom:18px;left:28px;font:11px 'JetBrains Mono';color:#4d4d4d;z-index:3}
</style></head><body>
<canvas id="c"></canvas>
<header><span>Wachtwoordduif</span><span>Inloggen</span></header>
<main><h1>Deel een wachtwoord dat zichzelf wist</h1>
<p class="s">Plak het hieronder. Je krijgt een link die één keer werkt. Daarna is het weg.</p>
<div class="k"><textarea id="t" placeholder="Wachtwoord, code of tekst…" spellcheck="false"></textarea><div class="r"><span>Verdwijnt na 1 dag</span><button id="b">Maak link</button></div></div></main>
<div class="tag">6 · Rustige matrix in grijs: Wachtwoordduif zakt af en toe wit mee</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let W,H;
let init=null,mx=-999,my=-999,typed=0,sealed=0;
function rs(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);init&&init()}
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
document.getElementById('t').addEventListener('input',()=>{typed=1});
document.getElementById('b').addEventListener('click',()=>{sealed=performance.now()});

const POOL='abcdefghjkmnpqrstuvwxyz23456789';
const WRD=['W4chtw00rdduif','Wachtw00rdd|1f','w@chtwo0rdduif','Wachtwoordd0if','W4chtwoordduif','Wachtwo0rdduif'];
let S=24,cols,rows,col=[],word=null,nextW=2500;
const rc=()=>POOL[Math.random()*POOL.length|0];
function mk(i,spread){return{x:i,y:spread?Math.random()*rows*1.4-rows*.2:-Math.random()*rows*.6,v:.025+Math.random()*.05,L:8+Math.random()*16,ch:Array.from({length:rows+4},rc)}}
init=()=>{cols=Math.ceil(W/S);rows=Math.ceil(H/S);col=[];for(let i=0;i<cols;i++)if(Math.random()<.45)col.push(mk(i,true))}
function f(t){x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);x.font='500 14px JetBrains Mono';x.textAlign='center';x.textBaseline='middle';
for(const c of col){c.y+=c.v;if(c.y-c.L>rows){Object.assign(c,mk(c.x,false));c.x=Math.random()*cols|0}
if(Math.random()<.015)c.ch[Math.random()*c.ch.length|0]=rc();
for(let r=0;r<rows;r++){const d=c.y-r;if(d<0||d>=c.L)continue;
let a=Math.pow(1-d/c.L,2)*.16;
const px=c.x*S,py=r*S;const md=Math.hypot(px-mx,py-my);if(md<120)a+=(1-md/120)*.06;
const k=Math.hypot(Math.abs(px-W/2)/(W*.3),Math.abs(py-H/2)/(H*.38));a*=.3+.7*Math.min(1,k);
if(a<.01)continue;const g=c.ch[r%c.ch.length];x.fillStyle='rgba(255,255,255,'+(a*.5)+')';x.fillText(g,px+S/2,py+S/2+1);x.fillStyle='rgba(0,0,0,'+Math.min(1,a*5)+')';x.fillText(g,px+S/2,py+S/2)}}
// het woord: valt op dezelfde manier, wit, af en toe
if(!word&&t>nextW){const w=WRD[Math.random()*WRD.length|0];word={w,x:Math.floor(Math.random()*cols),y:-1,v:.045}}
if(word){word.y+=word.v;const n=word.w.length;
for(let i=0;i<n;i++){const r=Math.floor(word.y)-(n-1-i);if(r<0||r>=rows)continue;
const fade=Math.min(1,(rows-r)/4);const k=Math.hypot(Math.abs(word.x*S-W/2)/(W*.3),Math.abs(r*S-H/2)/(H*.38));const dim=.35+.65*Math.min(1,k);
x.fillStyle='rgba(255,255,255,'+(.95*fade*Math.max(dim,.55))+')';x.fillText(word.w[i],word.x*S+S/2,r*S+S/2)}
if(word.y-n>rows){word=null;nextW=t+7000+Math.random()*6000}}
requestAnimationFrame(f)}requestAnimationFrame(f);
// kijkvoorbeeld: eerste woord snel
nextW=1200;
rs();addEventListener('resize',rs);
</script></body></html>
